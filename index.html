<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa do Bolo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Jost:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Jost:wght@400;500;600;700&display=swap"></noscript>
<style>
:root{
  --preto:#170f07;
  --marrom:#3d2716;
  --dourado:#c8983f;
  --dourado-forte:#a97b25;
  --dourado-claro:#eecf9e;
  --creme:#faf3e4;
  --rosa:#d98aa0;
  --branco:#fffdf8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--creme);color:var(--preto);font-family:'Jost',Arial,Helvetica,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.script{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:920px;margin:0 auto;padding:0 24px}
button{font-family:'Jost'}

/* ---- hero ---- */
header{position:relative;color:var(--creme);text-align:center;overflow:hidden;display:flex;align-items:center;justify-content:center;border-bottom:6px solid var(--dourado);
  background:
    repeating-linear-gradient(135deg, rgba(200,152,63,.05) 0px, rgba(200,152,63,.05) 1px, transparent 1px, transparent 34px),
    radial-gradient(ellipse at 50% 0%, #4a3018 0%, #170f07 72%);
  padding:64px 0 56px;
}
header .content{position:relative;z-index:2;padding:0 24px;max-width:640px}
.hero-photo{display:flex;justify-content:center;margin-top:34px}
.hero-photo .hp{width:260px;height:260px;border-radius:50%;overflow:hidden;border:3px solid var(--dourado);box-shadow:0 16px 34px rgba(0,0,0,.45);position:relative}
.hero-photo .hp::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid var(--dourado-claro);opacity:.6}
.hero-photo .hp img{width:100%;height:100%;object-fit:cover}
.brand-mark{width:100px;height:100px;border-radius:50%;border:2px solid var(--dourado);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;background:rgba(23,15,7,.6)}
.brand-mark svg{width:46px;height:46px}
header .eyebrow{font-size:.82rem;letter-spacing:4px;color:var(--dourado-claro);opacity:.9;margin-bottom:12px;font-weight:600}
header h1{font-size:clamp(2.8rem,9vw,4.3rem);font-weight:700;color:var(--branco);letter-spacing:.5px}
header p{font-size:1.1rem;color:var(--creme);opacity:.92;max-width:38ch;margin:16px auto 32px}
.cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:15px 30px;border-radius:2px;font-size:.95rem;font-weight:600;letter-spacing:.5px;border:2px solid var(--dourado);cursor:pointer;transition:opacity .2s}
.btn:active{opacity:.7}
.btn-fill{background:var(--dourado);color:var(--preto);border-color:var(--dourado)}
.btn-outline{background:transparent;color:var(--dourado-claro)}

/* ---- sections ---- */
section{padding:70px 0}
.sec-title{text-align:center;margin-bottom:6px}
.sec-title .script{display:block;font-size:1.2rem;color:var(--rosa);font-style:italic;margin-bottom:4px}
.sec-title h2{font-size:clamp(2.1rem,5vw,2.7rem);color:var(--marrom);font-weight:700;letter-spacing:.3px}
.divider{width:80px;height:3px;background:var(--dourado);margin:22px auto 44px;position:relative;border-radius:2px}
.divider::after{content:"◆";position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-size:.7rem;color:var(--dourado-forte);background:var(--creme);padding:0 8px}
section.alt .divider::after{background:var(--branco)}
section.dark .divider::after{background:var(--preto)}

/* ---- gallery ---- */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;max-width:760px;margin:0 auto}
.gallery .g-card{max-width:220px;margin:0 auto;width:100%}
.g-card{position:relative;border-radius:4px;overflow:hidden;aspect-ratio:4/5;box-shadow:0 10px 26px rgba(23,15,7,.18);border:2px solid var(--dourado)}
.g-card img{width:100%;height:100%;object-fit:cover}
.g-card .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 14px 12px;background:linear-gradient(0deg,rgba(23,15,7,.92),rgba(23,15,7,0))}
.g-card .cap span{font-size:1.1rem;font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--dourado-claro)}

/* ---- menu ---- */
.cat-block{margin-bottom:36px}
.cat-block .cat-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--dourado);padding-bottom:9px;margin-bottom:4px;gap:10px}
.cat-block h3{color:var(--marrom);font-size:1.7rem;font-weight:700}
.cat-block .price-tag{font-size:.72rem;letter-spacing:.5px;color:var(--rosa);white-space:nowrap;font-weight:600}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed #ddc9a0;gap:12px}
.item-row:last-child{border-bottom:none}
.item-name{font-size:1.05rem}
.item-price{white-space:nowrap;font-size:.97rem;color:var(--marrom);font-weight:600;text-align:right;min-width:64px}
.add-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--marrom);background:var(--branco);color:var(--marrom);font-size:1.3rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;line-height:0;transition:background .15s,color .15s}
.add-btn.added{background:var(--dourado);color:var(--preto);border-color:var(--dourado)}

/* ---- especiais (sob consulta) ---- */
.especiais-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px}
.esp-card{background:var(--branco);border:2px solid var(--dourado);border-radius:6px;overflow:hidden;box-shadow:0 8px 20px rgba(23,15,7,.1)}
.esp-card img{width:100%;height:170px;object-fit:cover}
.esp-body{padding:18px 18px 20px}
.esp-body h4{font-family:'Cormorant Garamond';font-size:1.4rem;color:var(--marrom);font-weight:700}
.esp-body p{font-size:.88rem;color:var(--marrom);opacity:.85;margin:6px 0 14px}
.esp-body a.consult{display:inline-block;font-size:.8rem;font-weight:600;color:var(--preto);background:var(--dourado);padding:9px 16px;border-radius:2px;letter-spacing:.3px}

/* ---- depoimentos ---- */
.depo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.depo-card{background:rgba(255,255,255,.05);border:1px solid var(--dourado);border-radius:6px;padding:22px 20px}
.depo-card .stars{color:var(--dourado);font-size:.9rem;letter-spacing:2px;margin-bottom:10px}
.depo-card p{font-size:.94rem;opacity:.92;font-style:italic;margin-bottom:14px}
.depo-card .name{font-size:.85rem;color:var(--dourado-claro);font-weight:600}

/* ---- loyalty ---- */
.loyalty-wrap{max-width:560px;margin:0 auto}
.loyalty{background:linear-gradient(135deg,var(--preto),var(--marrom) 120%);color:var(--creme);border-radius:10px;padding:38px 30px;border:2px solid var(--dourado)}
.loyalty h3{color:var(--dourado-claro);font-size:1.8rem;text-align:center;font-weight:700}
.loyalty p.rule{text-align:center;font-size:.92rem;opacity:.85;margin:10px auto 24px;max-width:40ch}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;max-width:340px;margin:0 auto}
.stamp{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--dourado);display:flex;align-items:center;justify-content:center;color:var(--dourado);opacity:.55;font-size:.85rem}
.stamp.filled{background:var(--dourado);color:var(--preto);opacity:1;border-style:solid;font-weight:700}
.loyalty-actions{text-align:center;margin-top:26px}
.loyalty-note{text-align:center;margin-top:14px;font-size:.78rem;opacity:.65}

/* ---- modal ---- */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(23,15,7,.75);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--branco);border-radius:8px;max-width:400px;width:100%;padding:28px 26px;border:2px solid var(--dourado);max-height:90vh;overflow-y:auto}
.modal h3{font-family:'Cormorant Garamond';color:var(--marrom);font-size:1.6rem;margin-bottom:4px;font-weight:700}
.modal p.sub{font-size:.85rem;color:var(--marrom);opacity:.75;margin-bottom:18px}
.modal label{display:block;font-size:.8rem;color:var(--marrom);font-weight:600;margin-bottom:5px;margin-top:14px}
.modal input{width:100%;padding:11px 12px;border:1.5px solid #ddc9a0;border-radius:4px;font-size:.95rem;font-family:'Jost'}
.modal-buttons{display:flex;gap:10px;margin-top:22px}
.modal-buttons .btn{flex:1;text-align:center;font-size:.85rem;padding:12px}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.4rem;color:var(--marrom);cursor:pointer;line-height:1}
.modal{position:relative}
.card-result{display:none;margin-top:18px;text-align:center}
.card-result.open{display:block}
.card-result .stamps{margin:16px auto 10px}
.card-result .free{color:var(--rosa);font-weight:700;font-size:1rem;margin-top:10px}
.client-name-tag{text-align:center;font-family:'Cormorant Garamond';font-size:1.3rem;color:var(--marrom);font-weight:700}
.small-btn{font-size:.82rem;padding:9px 16px;border:1.5px solid var(--marrom);border-radius:3px;background:transparent;color:var(--marrom);cursor:pointer;margin-top:12px}

/* ---- footer ---- */
footer{background:var(--preto);color:var(--creme);text-align:center;padding:60px 22px 38px;border-top:6px solid var(--dourado)}
footer h3{color:var(--dourado-claro);font-size:1.6rem;margin-bottom:10px;font-weight:700}
footer .links{display:flex;justify-content:center;gap:16px;margin:24px 0;flex-wrap:wrap}
footer .links a{border:2px solid var(--dourado);padding:12px 24px;border-radius:2px;font-size:.9rem;font-weight:600;transition:background .15s}
footer .links a:active{background:rgba(200,152,63,.15)}
.pay-methods{font-size:.78rem;opacity:.6;margin-top:22px;letter-spacing:.3px}

/* ---- floating cart ---- */
#cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--preto);color:var(--creme);padding:14px 20px;display:none;align-items:center;justify-content:space-between;box-shadow:0 -6px 18px rgba(0,0,0,.3);z-index:50;border-top:3px solid var(--dourado)}
#cartbar span{font-size:.9rem}
#cartbar .btn{padding:11px 20px;font-size:.85rem}
</style>
</head>
